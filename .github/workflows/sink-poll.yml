name: phase-a sink poll

# ntfy drops messages after a short retention window, so a 14-day test
# cannot read the topic at the end. Poll often and append to data/events.csv.

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours, off the hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sink-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Poll ntfy and append new events
        run: python3 tools/collect_events.py
      - name: Commit if anything changed
        run: |
          git config user.name "sink-bot"
          git config user.email "sink-bot@users.noreply.github.com"
          git add data/events.csv data/last_poll.json
          if git diff --cached --quiet; then
            echo "no new events"
          else
            git commit -m "sink: $(date -u +%FT%TZ)"
            git push
          fi
